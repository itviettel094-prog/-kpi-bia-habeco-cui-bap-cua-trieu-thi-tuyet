<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nhập Sản Lượng</title>
  <style>
    :root { --green:#1b8a3a; --green-dark:#14692c; }
    body { font-family: Arial, sans-serif; background:#f4f5f7; margin:0; padding:20px; text-align:center; color:var(--green); }
    .card { background:#fff; max-width:600px; margin:0 auto; padding:24px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.1); text-align:center; }
    h2 { margin-top:0; color:var(--green); text-align:center; }

    fieldset { border:1px solid #dde1e6; border-radius:8px; margin-bottom:16px; padding:12px 16px; text-align:center; }
    fieldset.collapsible { padding:0; overflow:hidden; }
    legend { font-weight:bold; color:var(--green); padding:0 6px; text-align:center; }

    fieldset.bg-blue { background:#dcefff; border-color:#90c2f0; }
    fieldset.bg-yellow { background:#fff4bf; border-color:#f0d45a; }

    .group-header {
      display:flex; align-items:center; justify-content:center; gap:8px;
      cursor:pointer; padding:12px 16px; user-select:none; position:relative;
    }
    .group-header .arrow {
      display:inline-block; transition: transform .2s ease;
      font-size:12px; color:var(--green);
    }
    .group-header.collapsed .arrow { transform: rotate(-90deg); }
    .group-title { font-weight:bold; color:var(--green); text-align:center; }
    .group-body { padding:0 16px 16px 16px; }
    .group-body.hidden { display:none; }

    label { display:block; font-size:13px; margin-top:10px; margin-bottom:4px; color:var(--green); text-align:center; }
    input, select, textarea {
      width:100%; padding:8px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; font-size:14px;
      text-align:center; color:var(--green); font-family:inherit;
    }
    input::placeholder, textarea::placeholder { color:var(--green); opacity:.6; }
    input[readonly] { background:#f0f0f0; color:var(--green); font-weight:bold; }
    textarea { text-align:center; }

    .row2 { display:flex; gap:10px; }
    .row2 > div { flex:1; }

    button {
      margin-top:20px; width:100%; padding:12px; background:var(--green); color:#fff;
      border:none; border-radius:6px; font-size:15px; cursor:pointer; text-align:center;
    }
    button:disabled { background:#999; }
    #msg { margin-top:12px; text-align:center; font-size:14px; color:var(--green); }
    #existingBanner {
      display:none; background:#fff8e1; border:1px solid #ffca28; color:var(--green);
      padding:10px 14px; border-radius:6px; font-size:13px; margin-bottom:14px; text-align:center;
    }
    .btn-row { display:flex; gap:10px; }
    .btn-row button { flex:1; }
    #btnDelete { background:#c62828; color:#fff; display:none; }
    #btnDelete:disabled { background:#999; }

    /* Toast */
    #toastWrap { position:fixed; top:16px; left:16px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
    .toast {
      background:#fff; color:var(--green); border-left:5px solid var(--green);
      padding:12px 18px; border-radius:6px; box-shadow:0 4px 14px rgba(0,0,0,.2);
      font-size:14px; font-weight:bold; animation: toastIn .3s ease forwards;
    }
    .toast.out { animation: toastOut .4s ease forwards; }
    @keyframes toastIn { from { transform:translateX(-30px); opacity:0; } to { transform:translateX(0); opacity:1; } }
    @keyframes toastOut { from { transform:translateX(0); opacity:1; } to { transform:translateX(-120%); opacity:0; } }
  </style>
</head>
<body>
  <div id="toastWrap"></div>

  <div class="card">
    <h2>📋 Nhập Sản Lượng Hàng Ngày</h2>

    <div id="existingBanner">
      ⚠️ <b>Ngày + điểm bán này đã có dữ liệu.</b> Thông tin cũ đã được nạp lại bên dưới — bạn có thể sửa rồi bấm "Cập nhật", hoặc bấm "Xóa dữ liệu" nếu muốn xóa.
    </div>

    <form id="salesForm">
      <fieldset>
        <legend>Thông tin ca</legend>
        <div class="row2">
          <div>
            <label>Ngày *</label>
            <input type="date" id="ngay" required>
          </div>
          <div>
            <label>Vùng *</label>
            <select id="vung" required onchange="updateDiemBan()">
              <option value="">-- Chọn Vùng --</option>
            </select>
          </div>
        </div>
        <div class="row2">
          <div>
            <label>Điểm bán *</label>
            <select id="diemBan" required onchange="updateDiaChi()">
              <option value="">-- Chọn Vùng trước --</option>
            </select>
          </div>
          <div>
            <label>Địa chỉ</label>
            <input type="text" id="diaChi" readonly placeholder="Tự điền theo điểm bán">
          </div>
        </div>
        <label>Khách tiếp cận</label>
        <input type="number" id="khachTiepCan" min="0" placeholder="Số khách">
      </fieldset>

      <fieldset class="collapsible bg-blue">
        <div class="group-header" onclick="toggleGroup('group-t24')">
          <span class="arrow">▾</span>
          <span class="group-title">Bán - thùng 24</span>
        </div>
        <div class="group-body" id="group-t24">
          <div class="row2">
            <div><label>Premium</label><input type="number" id="t24_premium" min="0" value="0"></div>
            <div><label>Sleek 330ml</label><input type="number" id="t24_sleek" min="0" value="0"></div>
          </div>
          <div class="row2">
            <div><label>Trúc Bạch</label><input type="number" id="t24_trucbach" min="0" value="0"></div>
            <div><label>Bia hơi 500ml</label><input type="number" id="t24_biahoi" min="0" value="0"></div>
          </div>
        </div>
      </fieldset>

      <fieldset class="collapsible">
        <div class="group-header collapsed" onclick="toggleGroup('group-le')">
          <span class="arrow">▾</span>
          <span class="group-title">Bán - lon lẻ</span>
        </div>
        <div class="group-body hidden" id="group-le">
          <div class="row2">
            <div><label>Premium</label><input type="number" id="le_premium" min="0" value="0"></div>
            <div><label>Sleek 330ml</label><input type="number" id="le_sleek" min="0" value="0"></div>
          </div>
          <div class="row2">
            <div><label>Trúc Bạch</label><input type="number" id="le_trucbach" min="0" value="0"></div>
            <div><label>Bia hơi 500ml</label><input type="number" id="le_biahoi" min="0" value="0"></div>
          </div>
        </div>
      </fieldset>

      <fieldset class="collapsible bg-yellow">
        <div class="group-header" onclick="toggleGroup('group-qt')">
          <span class="arrow">▾</span>
          <span class="group-title">Quà tặng - lon</span>
        </div>
        <div class="group-body" id="group-qt">
          <div class="row2">
            <div><label>Premium (tự động)</label><input type="number" id="qt_premium" value="0" readonly></div>
            <div><label>Sleek 330ml (tự động)</label><input type="number" id="qt_sleek" value="0" readonly></div>
          </div>
          <label>Tổng quà tặng (tự động)</label>
          <input type="number" id="tongQuaTang" value="0" readonly>
        </div>
      </fieldset>

      <fieldset class="collapsible">
        <div class="group-header collapsed" onclick="toggleGroup('group-ghichu')">
          <span class="arrow">▾</span>
          <span class="group-title">Ghi chú</span>
        </div>
        <div class="group-body hidden" id="group-ghichu">
          <textarea id="ghiChu" rows="2"></textarea>
        </div>
      </fieldset>

      <div class="btn-row">
        <button type="submit" id="submitBtn">Gửi báo cáo</button>
        <button type="button" id="btnDelete" onclick="xoaDuLieu()">Xóa dữ liệu</button>
      </div>
      <div id="msg"></div>
    </form>
  </div>

<script>
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwQAvhnrRRGqMz_5h8nf0j1rjAQ5EB1U4hF4FXkEE01ZXjGo-2VDeYbtdLeHvK_RRBa/exec';

  let danhSach = {};
  let existingRowNumber = null;

  // ---- Thu gọn / mở rộng từng nhóm ----
  function toggleGroup(id) {
    const body = document.getElementById(id);
    const header = body.previousElementSibling;
    body.classList.toggle('hidden');
    header.classList.toggle('collapsed');
  }

  function openGroup(id) {
    const body = document.getElementById(id);
    body.classList.remove('hidden');
    body.previousElementSibling.classList.remove('collapsed');
  }

  // ---- Toast: hiện rồi trượt sang trái và biến mất ----
  function showToast(text) {
    const wrap = document.getElementById('toastWrap');
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    wrap.appendChild(t);
    setTimeout(function() {
      t.classList.add('out');
      t.addEventListener('animationend', function() { t.remove(); });
    }, 2500);
  }

  // ---- Quà tặng: mua 1 thùng tặng 2 lon (1 Premium + 1 Sleek 330ml) ----
  function tinhTongQuaTang() {
    
    
    const soThung = ['t24_premium','t24_sleek','t24_trucbach','t24_biahoi'].reduce(function(s, id) { return s + Number(document.getElementById(id).value || 0); }, 0); const qua = Math.min(soThung, 8); document.getElementById('qt_premium').value = qua; document.getElementById('qt_sleek').value = qua; document.getElementById('tongQuaTang').value = qua * 2;
  }
  ['t24_premium','t24_sleek','t24_trucbach','t24_biahoi'].forEach(function(id) { document.getElementById(id).addEventListener('input', tinhTongQuaTang); });
  

  function callGet(action, params) {
    const url = new URL(WEB_APP_URL);
    url.searchParams.set('action', action);
    Object.keys(params || {}).forEach(k => url.searchParams.set(k, params[k]));
    return fetch(url.toString())
      .then(r => r.json())
      .then(res => {
        if (!res.success) throw new Error(res.error || 'Lỗi không xác định');
        return res.data;
      });
  }

  function callPost(action, payload) {
    return fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, payload))
    })
      .then(r => r.json())
      .then(res => {
        if (!res.success) throw new Error(res.error || 'Lỗi không xác định');
        return res.data;
      });
  }

  callGet('getDanhSach').then(function(data) {
    danhSach = data;
    const vungSelect = document.getElementById('vung');
    Object.keys(data).sort().forEach(function(vung) {
      const opt = document.createElement('option');
      opt.value = vung;
      opt.textContent = vung;
      vungSelect.appendChild(opt);
    });
  }).catch(function(err) {
    document.getElementById('msg').style.color = 'red';
    document.getElementById('msg').textContent = 'Lỗi tải danh sách: ' + err.message;
  });

  function updateDiemBan() {
    const vung = document.getElementById('vung').value;
    const diemBanSelect = document.getElementById('diemBan');
    diemBanSelect.innerHTML = '<option value="">-- Chọn Điểm bán --</option>';
    (danhSach[vung] || []).forEach(function(item) {
      const opt = document.createElement('option');
      opt.value = item.ten;
      opt.dataset.diaChi = item.diaChi;
      opt.textContent = item.ten;
      diemBanSelect.appendChild(opt);
    });
    document.getElementById('diaChi').value = '';
    resetCheMoHinhThem();
    kiemTraDuLieuCu();
  }

  function updateDiaChi() {
    const diemBanSelect = document.getElementById('diemBan');
    const selected = diemBanSelect.options[diemBanSelect.selectedIndex];
    document.getElementById('diaChi').value = selected ? (selected.dataset.diaChi || '') : '';
    kiemTraDuLieuCu();
  }

  document.getElementById('ngay').addEventListener('change', kiemTraDuLieuCu);

  function kiemTraDuLieuCu() {
    const ngay = document.getElementById('ngay').value;
    const vung = document.getElementById('vung').value;
    const diemBan = document.getElementById('diemBan').value;

    if (!ngay || !vung || !diemBan) {
      resetCheMoHinhThem();
      return;
    }

    document.getElementById('msg').textContent = 'Đang kiểm tra dữ liệu...';
    document.getElementById('msg').style.color = '';

    callGet('checkExistingData', { ngay: ngay, vung: vung, diemBan: diemBan })
      .then(function(result) {
        document.getElementById('msg').textContent = '';
        if (result && result.found) {
          napDuLieuCu(result.data, result.rowNumber);
        } else {
          resetCheMoHinhThem();
        }
      })
      .catch(function(err) {
        document.getElementById('msg').style.color = 'red';
        document.getElementById('msg').textContent = 'Lỗi kiểm tra: ' + err.message;
      });
  }

  function napDuLieuCu(data, rowNumber) {
    existingRowNumber = rowNumber;

    document.getElementById('khachTiepCan').value = data.khachTiepCan || 0;
    document.getElementById('t24_premium').value = data.t24_premium || 0;
    document.getElementById('t24_sleek').value = data.t24_sleek || 0;
    document.getElementById('t24_trucbach').value = data.t24_trucbach || 0;
    document.getElementById('t24_biahoi').value = data.t24_biahoi || 0;
    document.getElementById('le_premium').value = data.le_premium || 0;
    document.getElementById('le_sleek').value = data.le_sleek || 0;
    document.getElementById('le_trucbach').value = data.le_trucbach || 0;
    document.getElementById('le_biahoi').value = data.le_biahoi || 0;
    document.getElementById('qt_premium').value = data.qt_premium || 0;
    document.getElementById('qt_sleek').value = data.qt_sleek || 0;
    tinhTongQuaTang();
    document.getElementById('ghiChu').value = data.ghiChu || '';
    if (data.ghiChu) openGroup('group-ghichu');
    if (data.diaChi) document.getElementById('diaChi').value = data.diaChi;

    document.getElementById('existingBanner').style.display = 'block';
    document.getElementById('submitBtn').textContent = 'Cập nhật dữ liệu';
    document.getElementById('btnDelete').style.display = 'block';
  }

  function resetCheMoHinhThem() {
    existingRowNumber = null;
    document.getElementById('existingBanner').style.display = 'none';
    document.getElementById('submitBtn').textContent = 'Gửi báo cáo';
    document.getElementById('btnDelete').style.display = 'none';
  }

  document.getElementById('salesForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    msg.textContent = 'Đang gửi...';
    msg.style.color = '';

    const val = id => document.getElementById(id).value;
    const num = id => Number(document.getElementById(id).value || 0);

    tinhTongQuaTang();

    const formData = {
      rowNumber: existingRowNumber,
      ngay: val('ngay'),
      vung: val('vung'),
      diemBan: val('diemBan'),
      diaChi: val('diaChi'),
      khachTiepCan: num('khachTiepCan'),
      t24_premium: num('t24_premium'),
      t24_sleek: num('t24_sleek'),
      t24_trucbach: num('t24_trucbach'),
      t24_biahoi: num('t24_biahoi'),
      le_premium: num('le_premium'),
      le_sleek: num('le_sleek'),
      le_trucbach: num('le_trucbach'),
      le_biahoi: num('le_biahoi'),
      qt_premium: num('qt_premium'),
      qt_sleek: num('qt_sleek'),
      tongQuaTang: num('tongQuaTang'),
      ghiChu: val('ghiChu')
    };

    callPost('submitForm', { formData: formData })
      .then(function(result) {
        msg.textContent = '';
        showToast(result.updated ? '✅ Đã cập nhật dữ liệu thành công!' : '✅ Đã gửi báo cáo thành công!');
        document.getElementById('salesForm').reset();
        document.getElementById('diemBan').innerHTML = '<option value="">-- Chọn Vùng trước --</option>';
        tinhTongQuaTang();
        resetCheMoHinhThem();
        btn.disabled = false;
      })
      .catch(function(err) {
        msg.style.color = 'red';
        msg.textContent = '❌ Lỗi: ' + err.message;
        btn.disabled = false;
      });
  });

  function xoaDuLieu() {
    if (!existingRowNumber) return;
    if (!confirm('Bạn chắc chắn muốn xóa dữ liệu của ngày/điểm bán này?')) return;

    const btnDelete = document.getElementById('btnDelete');
    const msg = document.getElementById('msg');
    btnDelete.disabled = true;
    msg.textContent = 'Đang xóa...';
    msg.style.color = '';

    callPost('deleteRow', { rowNumber: existingRowNumber })
      .then(function() {
        msg.textContent = '';
        showToast('🗑️ Đã xóa dữ liệu.');
        document.getElementById('salesForm').reset();
        document.getElementById('diemBan').innerHTML = '<option value="">-- Chọn Vùng trước --</option>';
        tinhTongQuaTang();
        resetCheMoHinhThem();
        btnDelete.disabled = false;
      })
      .catch(function(err) {
        msg.style.color = 'red';
        msg.textContent = '❌ Lỗi xóa: ' + err.message;
        btnDelete.disabled = false;
      });
  }
</script>
</body>
</html>
